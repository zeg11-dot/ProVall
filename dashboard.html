<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — ProVall</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --ink:#0F1329; --panel:#181D3D; --panel-2:#1E2450; --line:#2C3466; --text:#E9ECF7;
    --muted:#8B92BE; --teal:#34D8C6; --teal-dim:#1D4A47; --amber:#FFB648; --coral:#FB7185;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;line-height:1.5;}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px 80px;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .mono{font-family:'JetBrains Mono',monospace;}
  nav{border-bottom:1px solid var(--line);padding:16px 0;margin-bottom:32px;}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;padding-bottom:0;}
  .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
  .user-email{color:var(--muted);font-size:13px;margin-right:14px;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;}
  .btn-ghost:hover{border-color:var(--teal);}
  section{margin-bottom:40px;}
  section h2{font-size:20px;margin-bottom:4px;}
  .section-sub{color:var(--muted);font-size:13.5px;margin-bottom:18px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field input, .field textarea{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--ink);color:var(--text);font-size:14px;font-family:inherit;
  }
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--teal);}
  .btn-primary{
    background:var(--teal);color:var(--ink);border:none;border-radius:8px;padding:10px 18px;
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;
  }
  .btn-primary:disabled{opacity:0.55;cursor:default;}
  .badge{display:inline-block;font-size:11.5px;font-family:'JetBrains Mono',monospace;padding:3px 9px;border-radius:20px;}
  .badge.ok{background:var(--teal-dim);color:var(--teal);}
  .badge.warn{background:#3d2f10;color:var(--amber);}
  .badge.pending{background:var(--panel-2);color:var(--muted);}
  .badge.fail{background:#3d1620;color:var(--coral);}
  .tx-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 0;border-bottom:1px solid var(--line);
  }
  .tx-row:last-child{border-bottom:none;}
  .tx-main{font-size:14px;}
  .tx-sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .tx-actions{display:flex;gap:8px;align-items:center;}
  .error-msg{color:var(--coral);font-size:13px;margin-top:8px;}
  .info-msg{color:var(--muted);font-size:13px;margin-top:8px;}
  .empty{color:var(--muted);font-size:13.5px;padding:8px 0;}
  .loading{color:var(--muted);font-size:13.5px;}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="logo">ProVall</div>
    <div style="display:flex;align-items:center;">
      <span class="user-email mono" id="userEmail"></span>
      <button class="btn-ghost" id="signOutBtn">Sign out</button>
    </div>
  </div>
</nav>

<div class="wrap">
  <div id="loadingState" class="loading">Loading your dashboard…</div>

  <div id="dashboardContent" style="display:none;">

    <section id="businessSection"></section>

    <section>
      <h2>Payments to you</h2>
      <div class="section-sub">Transactions where you're the one paying.</div>
      <div class="panel" id="customerTxPanel"></div>
    </section>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
let currentUser = null;
let currentBusiness = null;

function money(cents){ return '$' + (cents / 100).toFixed(2); }

function statusBadge(status){
  const map = {
    pending: ['pending', 'Waiting on agreement'],
    ready_to_charge: ['warn', 'Ready to pay'],
    checkout_created: ['warn', 'Payment in progress'],
    paid: ['ok', 'Paid'],
    failed: ['fail', 'Payment failed'],
    canceled: ['fail', 'Canceled'],
  };
  const [cls, label] = map[status] || ['pending', status];
  return `<span class="badge ${cls}">${label}</span>`;
}

async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session){
    window.location.href = 'login.html';
    return;
  }
  currentUser = session.user;
  document.getElementById('userEmail').textContent = currentUser.email;
  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });

  await loadBusinessSection();
  await loadCustomerTransactions();

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('dashboardContent').style.display = 'block';
}

// ---------- Business section (you as a business owner) ----------
async function loadBusinessSection(){
  const { data: business } = await supabaseClient
    .from('businesses')
    .select('*')
    .eq('owner_id', currentUser.id)
    .maybeSingle();

  currentBusiness = business;
  const el = document.getElementById('businessSection');

  if (!business){
    el.innerHTML = `
      <h2>Register a business</h2>
      <div class="section-sub">Do businesses use your ProVall account to collect payments from customers? Set that up here.</div>
      <div class="panel">
        <div class="field">
          <label for="bizNameInput">Business name</label>
          <input type="text" id="bizNameInput" placeholder="e.g. Acme Plumbing">
        </div>
        <button class="btn-primary" id="registerBizBtn">Register business</button>
        <div class="error-msg" id="bizRegError"></div>
      </div>
    `;
    document.getElementById('registerBizBtn').addEventListener('click', async () => {
      const name = document.getElementById('bizNameInput').value.trim();
      const errorEl = document.getElementById('bizRegError');
      if (!name){ errorEl.textContent = 'Enter a business name.'; return; }
      errorEl.textContent = '';
      const { error } = await supabaseClient
        .from('businesses')
        .insert({ owner_id: currentUser.id, name });
      if (error){ errorEl.textContent = error.message; return; }
      await loadBusinessSection();
    });
    return;
  }

  const onboarded = business.stripe_onboarding_complete;
  el.innerHTML = `
    <h2>${business.name}</h2>
    <div class="section-sub">Your business — collect payments from customers here.</div>
    <div class="panel" style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>Stripe account: ${onboarded ? '<span class="badge ok">Connected</span>' : '<span class="badge warn">Not connected</span>'}</div>
        ${onboarded ? '' : '<button class="btn-primary" id="connectStripeBtn">Connect with Stripe</button>'}
      </div>
      <div class="error-msg" id="connectStripeError"></div>
    </div>

    ${onboarded ? `
    <div class="panel" style="margin-bottom:20px;">
      <h3 style="font-size:15px;margin-bottom:14px;">Create a transaction</h3>
      <div class="field">
        <label for="custEmailInput">Customer's email (their ProVall account)</label>
        <input type="email" id="custEmailInput" placeholder="customer@example.com">
      </div>
      <div class="field">
        <label for="amountInput">Amount ($)</label>
        <input type="number" id="amountInput" min="0.01" step="0.01" placeholder="150.00">
      </div>
      <div class="field">
        <label for="descInput">What's it for?</label>
        <input type="text" id="descInput" placeholder="e.g. Kitchen sink repair">
      </div>
      <button class="btn-primary" id="createTxBtn">Send to customer</button>
      <div class="error-msg" id="createTxError"></div>
      <div class="info-msg" id="createTxInfo"></div>
    </div>
    ` : ''}

    <div class="panel">
      <h3 style="font-size:15px;margin-bottom:6px;">Your transactions</h3>
      <div id="bizTxList"></div>
    </div>
  `;

  if (!onboarded){
    document.getElementById('connectStripeBtn').addEventListener('click', async () => {
      const errorEl = document.getElementById('connectStripeError');
      errorEl.textContent = '';
      const { data, error } = await supabaseClient.functions.invoke('stripe-connect-onboard', {
        body: {
          business_id: business.id,
          return_url: window.location.href,
          refresh_url: window.location.href,
        },
      });
      if (error || data?.error){
        errorEl.textContent = (data && data.error) || error.message;
        return;
      }
      window.location.href = data.url;
    });
  } else {
    document.getElementById('createTxBtn').addEventListener('click', async () => {
      const email = document.getElementById('custEmailInput').value.trim();
      const dollars = parseFloat(document.getElementById('amountInput').value);
      const description = document.getElementById('descInput').value.trim();
      const errorEl = document.getElementById('createTxError');
      const infoEl = document.getElementById('createTxInfo');
      errorEl.textContent = '';
      infoEl.textContent = '';

      if (!email || !dollars || dollars <= 0){
        errorEl.textContent = 'Enter the customer\'s email and a valid amount.';
        return;
      }

      const { data: profile, error: profileError } = await supabaseClient
        .from('profiles')
        .select('id')
        .ilike('email', email)
        .maybeSingle();

      if (profileError){ errorEl.textContent = profileError.message; return; }
      if (!profile){
        errorEl.textContent = 'No ProVall account found for that email — ask them to sign up first.';
        return;
      }

      const { error: txError } = await supabaseClient
        .from('transactions')
        .insert({
          business_id: business.id,
          customer_id: profile.id,
          amount_cents: Math.round(dollars * 100),
          description,
          business_agreed: true,
        });

      if (txError){ errorEl.textContent = txError.message; return; }

      infoEl.textContent = 'Sent — waiting for the customer to agree.';
      document.getElementById('custEmailInput').value = '';
      document.getElementById('amountInput').value = '';
      document.getElementById('descInput').value = '';
      await renderBusinessTxList(business.id);
    });
  }

  await renderBusinessTxList(business.id);
}

async function renderBusinessTxList(businessId){
  const listEl = document.getElementById('bizTxList');
  const { data: txs, error } = await supabaseClient
    .from('transactions')
    .select('*')
    .eq('business_id', businessId)
    .order('created_at', { ascending: false });

  if (error){ listEl.innerHTML = `<div class="error-msg">${error.message}</div>`; return; }
  if (!txs || txs.length === 0){ listEl.innerHTML = '<div class="empty">No transactions yet.</div>'; return; }

  const customerIds = [...new Set(txs.map(t => t.customer_id))];
  const { data: profiles } = await supabaseClient
    .from('profiles')
    .select('id, email')
    .in('id', customerIds);
  const emailById = Object.fromEntries((profiles || []).map(p => [p.id, p.email]));

  listEl.innerHTML = txs.map(t => `
    <div class="tx-row">
      <div>
        <div class="tx-main">${money(t.amount_cents)} — ${t.description || 'No description'}</div>
        <div class="tx-sub">${emailById[t.customer_id] || 'Unknown customer'}</div>
      </div>
      <div class="tx-actions">${statusBadge(t.status)}</div>
    </div>
  `).join('');
}

// ---------- Customer section (you as a payer) ----------
async function loadCustomerTransactions(){
  const panel = document.getElementById('customerTxPanel');
  const { data: txs, error } = await supabaseClient
    .from('transactions')
    .select('*, business:businesses(name)')
    .eq('customer_id', currentUser.id)
    .order('created_at', { ascending: false });

  if (error){ panel.innerHTML = `<div class="error-msg">${error.message}</div>`; return; }
  if (!txs || txs.length === 0){ panel.innerHTML = '<div class="empty">No payment requests yet.</div>'; return; }

  panel.innerHTML = txs.map(t => `
    <div class="tx-row">
      <div>
        <div class="tx-main">${money(t.amount_cents)} to ${t.business?.name || 'Unknown business'}</div>
        <div class="tx-sub">${t.description || ''}</div>
      </div>
      <div class="tx-actions" id="tx-actions-${t.id}">${statusBadge(t.status)}</div>
    </div>
  `).join('');

  txs.forEach(t => {
    const actionsEl = document.getElementById(`tx-actions-${t.id}`);
    if (t.status === 'pending' && !t.customer_agreed){
      const btn = document.createElement('button');
      btn.className = 'btn-primary';
      btn.textContent = 'Agree';
      btn.style.marginLeft = '10px';
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const { error } = await supabaseClient
          .from('transactions')
          .update({ customer_agreed: true })
          .eq('id', t.id);
        if (error){ alert(error.message); btn.disabled = false; return; }
        await loadCustomerTransactions();
      });
      actionsEl.appendChild(btn);
    } else if (t.status === 'ready_to_charge' || t.status === 'failed'){
      const btn = document.createElement('button');
      btn.className = 'btn-primary';
      btn.textContent = `Pay ${money(t.amount_cents)}`;
      btn.style.marginLeft = '10px';
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Redirecting to Stripe…';
        const { data, error } = await supabaseClient.functions.invoke('create-transaction-checkout', {
          body: {
            transaction_id: t.id,
            success_url: window.location.href,
            cancel_url: window.location.href,
          },
        });
        if (error || data?.error){
          alert((data && data.error) || error.message);
          btn.disabled = false;
          btn.textContent = `Pay ${money(t.amount_cents)}`;
          return;
        }
        window.location.href = data.url;
      });
      actionsEl.appendChild(btn);
    }
  });
}

init();
</script>
</body>
</html>
