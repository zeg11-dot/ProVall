<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — ProVall</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap');
  :root{
    --ink:#0F1329; --panel:#181D3D; --line:#2C3466; --text:#E9ECF7;
    --muted:#8B92BE; --teal:#34D8C6; --coral:#FB7185;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:36px;width:100%;max-width:400px;
  }
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin-bottom:6px;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 13px;border-radius:8px;border:1px solid var(--line);
    background:var(--ink);color:var(--text);font-size:14px;
  }
  .field input:focus{outline:none;border-color:var(--teal);}
  .btn-primary{
    width:100%;background:var(--teal);color:var(--ink);border:none;border-radius:10px;
    padding:13px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;
    cursor:pointer;margin-top:6px;
  }
  .btn-primary:disabled{opacity:0.6;cursor:default;}
  .toggle-row{display:flex;gap:8px;margin-bottom:24px;background:var(--ink);border-radius:10px;padding:4px;}
  .toggle-row button{
    flex:1;background:transparent;border:none;color:var(--muted);padding:9px;border-radius:8px;
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;
  }
  .toggle-row button.active{background:var(--panel);color:var(--teal);}
  .error-msg{color:var(--coral);font-size:13px;margin-bottom:12px;min-height:16px;}
  .info-msg{color:var(--teal);font-size:13px;margin-bottom:12px;}
  .back-link{display:inline-block;color:var(--muted);font-size:13px;margin-bottom:20px;text-decoration:none;}
</style>
</head>
<body>

<div class="card">
  <a href="index.html" class="back-link">&larr; Back to ProVall</a>
  <div class="toggle-row">
    <button id="tabSignIn" class="active">Sign in</button>
    <button id="tabSignUp">Create account</button>
  </div>

  <h1 id="formTitle">Welcome back</h1>
  <div class="sub" id="formSub">Sign in to your ProVall account.</div>

  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="At least 6 characters">
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="info-msg" id="infoMsg" style="display:none;"></div>
  <button class="btn-primary" id="submitBtn">Sign in</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  let mode = new URLSearchParams(window.location.search).get('mode') === 'signup' ? 'signup' : 'signin';

  const tabSignIn = document.getElementById('tabSignIn');
  const tabSignUp = document.getElementById('tabSignUp');
  const formTitle = document.getElementById('formTitle');
  const formSub = document.getElementById('formSub');
  const submitBtn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');
  const infoMsg = document.getElementById('infoMsg');

  function renderMode(){
    errorMsg.textContent = '';
    infoMsg.style.display = 'none';
    if (mode === 'signup'){
      tabSignIn.classList.remove('active');
      tabSignUp.classList.add('active');
      formTitle.textContent = 'Create your account';
      formSub.textContent = 'Sign up once, then use the same account whether you\'re paying a business or getting paid as one.';
      submitBtn.textContent = 'Create account';
    } else {
      tabSignIn.classList.add('active');
      tabSignUp.classList.remove('active');
      formTitle.textContent = 'Welcome back';
      formSub.textContent = 'Sign in to your ProVall account.';
      submitBtn.textContent = 'Sign in';
    }
  }
  tabSignIn.addEventListener('click', () => { mode = 'signin'; renderMode(); });
  tabSignUp.addEventListener('click', () => { mode = 'signup'; renderMode(); });
  renderMode();

  // Already signed in? Skip straight to the dashboard.
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'dashboard.html';
  });

  submitBtn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    errorMsg.textContent = '';
    infoMsg.style.display = 'none';

    if (!email || !password){
      errorMsg.textContent = 'Enter your email and password.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Please wait…';

    if (mode === 'signup'){
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account';
      if (error){
        errorMsg.textContent = error.message;
        return;
      }
      if (data.session){
        window.location.href = 'dashboard.html';
      } else {
        infoMsg.style.display = 'block';
        infoMsg.textContent = 'Account created — check your email to confirm it, then sign in.';
        mode = 'signin';
        renderMode();
        infoMsg.style.display = 'block';
      }
    } else {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
      if (error){
        errorMsg.textContent = error.message;
        return;
      }
      window.location.href = 'dashboard.html';
    }
  });
</script>
</body>
</html>
